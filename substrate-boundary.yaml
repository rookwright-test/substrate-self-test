# The assessment boundary for the substrate self-test environment: the
# set of information resources that is the cloud service offering
# (CR26 MAS-CSO-IIR). This is the provider's declaration - substrate
# checks it against what it collects, but cannot prove it complete.
owner: Will Kern, CEO
declared_on: 2026-11-23
components:
  # The one AWS account and its home Region. Moved 2026-10-08 from
  # 034313911997, whose root access was unrecoverable, to an account in
  # Rookwright's own AWS organization.
  - type: aws
    account: "632839731153"
    regions: [us-east-2, us-west-2]
  # The Okta org that holds the offering's workforce identities.
  - type: okta
    org: https://integrator-2677113.okta.com
  # This repository: the offering's infrastructure code and CI.
  - type: github
    repository: rookwright-test/substrate-self-test
  # Not declared: the Kubernetes manifests in k8s/. They have never been
  # deployed to a cluster, so they are not an information resource of
  # the running offering (removed 2026-10-07). substrate still parses
  # them statically. Re-declare them as soon as they run on a cluster;
  # deploying to EKS is planned (substrate docs/REQUIREMENTS.md).

# Software the offering runs and patches, named as CISA's KEV catalog
# names vendors (substrate ADR 0041 answer 2; founder, 2026-11-23,
# option A). The monthly vulnerability review lists every KEV entry
# naming one of these as a possible match. A missing match never means
# "not affected": KEV's names are free text, none of these has an
# entry today, so their spelling there is unconfirmed, and the review
# reads every entry added in its window anyway. GitHub-hosted runner
# software (Linux, Git, OpenSSH...) is GitHub's to patch and isn't
# listed.
software:
  - vendor: PostgreSQL   # RDS substrate-self-test and its us-west-2 replica
  - vendor: Python       # the two Lambda functions (python3.13)
  - vendor: HashiCorp    # Terraform and its AWS and archive providers
  - vendor: Okta
  - vendor: GitHub
  - vendor: Amazon
