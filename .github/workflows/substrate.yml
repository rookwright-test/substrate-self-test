name: substrate

# Substrate verifies this repository's controls after every change
# (cm-4.2). On a pull request, the "substrate" job compiles the declared
# configuration and gates it against substrate-baseline-pr.json: a
# regression fails the required check, so the change can't merge. After
# a merge to main, "substrate-live" collects the live system with
# read-only access and gates it against substrate-baseline-live.json.
#
# The repository is public, so nothing but the gate's one-line verdict
# is printed: no reports, identities or artifacts are published.
# Substrate is private; it is built from a pinned commit with a
# read-only deploy key.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Continuous assurance (2026-11-05): the live system is also judged
  # every 6 hours, not only after a merge, so a change made outside a
  # pull request (an Okta admin, a console edit) is judged within 6
  # hours. Not hourly: substrate's GitHub collector reads at most 500
  # push, schedule and manual runs in 30 days (281 today, about 400 with
  # this schedule). cm-4.2 and substrate ADR 0030 count push runs only,
  # so a scheduled run's verdict never enters them. :41 stays clear of
  # the other schedules (drift at :17, control tasks at :00).
  schedule:
    - cron: "41 */6 * * *"

permissions: {}

# Scheduled runs have their own group. In a shared one, a scheduled run
# queued behind a merge's run would cancel any merge run already waiting
# (GitHub keeps one pending run per group), and cm-4.2 would then read
# that cancelled run as the merge's verification.
concurrency:
  group: substrate-${{ github.ref }}${{ github.event_name == 'schedule' && '-scheduled' || '' }}
  cancel-in-progress: false

env:
  SUBSTRATE_COMMIT: 65f33ee7c7f1fba211470482f383015e612448ad

jobs:
  verify:
    name: substrate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rookwright/substrate
          ref: ${{ env.SUBSTRATE_COMMIT }}
          ssh-key: ${{ secrets.SUBSTRATE_DEPLOY_KEY }}
          path: .substrate-src
          persist-credentials: false
      - name: Move substrate out of the scanned tree
        run: mv .substrate-src "$RUNNER_TEMP/substrate-src"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/substrate-src/go.mod
          cache: false
      - name: Build substrate
        run: cd "$RUNNER_TEMP/substrate-src" && go build -trimpath -o "$RUNNER_TEMP/substrate" ./cmd/substrate
      - name: Compile and gate the declared configuration
        run: |
          "$RUNNER_TEMP/substrate" compile --source . --boundary substrate-boundary.yaml \
            --parameters substrate-parameters.yaml --out "$RUNNER_TEMP/out" > "$RUNNER_TEMP/compile.log" 2>&1 \
            || { echo "substrate compile failed"; exit 2; }
          "$RUNNER_TEMP/substrate" gate --baseline substrate-baseline-pr.json --current "$RUNNER_TEMP/out/ksi_results.json"
      # Before the apply: an inbound rule or an IAM principal with security
      # access that this change creates must be declared in this change
      # (substrate ADR 0032). Prints only names already in this
      # repository; what it can't read yet appears as a warning.
      - name: Check new rules and holders are declared
        run: |
          "$RUNNER_TEMP/substrate" plan-check --source . --boundary substrate-boundary.yaml --parameters substrate-parameters.yaml

  # A scheduled run steps aside when a merge's live run is going or
  # waiting: that run judges the same system, and two at once would
  # share Okta's rate limit.
  schedule-guard:
    name: schedule-guard
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=0
          for status in in_progress queued; do
            n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/substrate.yml/runs" -f event=push -f branch=main -f status="$status" -f per_page=1 -q .total_count)
            busy=$((busy + n))
          done
          if [ "$busy" -gt 0 ]; then
            echo "A merge's live run is going or waiting; it judges the live system, so this scheduled run steps aside."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  verify-live:
    name: substrate-live
    needs: schedule-guard
    if: always() && (github.event_name == 'push' || (github.event_name == 'schedule' && needs.schedule-guard.outputs.go == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      # sc-13: a CMVP reading NIST couldn't give is surfaced as an issue.
      issues: write
      # A scheduled run reads whether a merge's run started meanwhile.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rookwright/substrate
          ref: ${{ env.SUBSTRATE_COMMIT }}
          ssh-key: ${{ secrets.SUBSTRATE_DEPLOY_KEY }}
          path: .substrate-src
          persist-credentials: false
      - name: Move substrate out of the scanned tree
        run: mv .substrate-src "$RUNNER_TEMP/substrate-src"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/substrate-src/go.mod
          cache: false
      - name: Build substrate
        run: cd "$RUNNER_TEMP/substrate-src" && go build -trimpath -o "$RUNNER_TEMP/substrate" ./cmd/substrate
      # sc-13 (2026-11-01): NIST CMVP readings of the declared modules.
      # The last reading is kept in the Actions cache, so a NIST outage
      # falls back to it for up to 7 days; substrate itself never writes
      # anywhere. Every fallback or unreadable page is printed here and
      # opened (or commented on) as an issue: never silent.
      - name: Restore the last CMVP reading
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cmvp
          key: cmvp-${{ github.run_id }}
          restore-keys: cmvp-
      - name: Read NIST CMVP certificates (sc-13)
        id: cmvp
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cmvp"
          "$RUNNER_TEMP/substrate" collect-cmvp --parameters substrate-parameters.yaml \
            --previous "$RUNNER_TEMP/cmvp/cmvp.json" --out "$RUNNER_TEMP/cmvp/cmvp.json" | tee "$RUNNER_TEMP/cmvp.log"
          echo "warnings=$(jq '.warnings | length' "$RUNNER_TEMP/cmvp/cmvp.json")" >> "$GITHUB_OUTPUT"
          echo "written=true" >> "$GITHUB_OUTPUT"
      # hashFiles() only sees the workspace, so it can't guard files in
      # runner.temp: it returned empty and these saves were skipped from
      # #80 to #94 (2026-11-03). The writing step reports instead.
      - name: Keep this CMVP reading for the next run
        if: always() && steps.cmvp.outputs.written == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cmvp
          key: cmvp-${{ github.run_id }}
      - name: Surface CMVP warnings
        if: steps.cmvp.outputs.warnings != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'NIST CMVP certificates could not all be read (run %s/%s/actions/runs/%s):\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; jq -r '.warnings[] | "- " + .' "$RUNNER_TEMP/cmvp/cmvp.json"; printf '\nWithin the 7-day grace period sc-13 is judged on the previous reading; after it, sc-13 is undetermined.\n')"
          open=$(gh issue list --label cmvp-warning --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "sc-13: NIST CMVP readings unavailable" --label cmvp-warning --assignee kernwill --body "$body"; fi
      # ac-6.2 (substrate ADR 0033): GitHub has no permission history on
      # the Free plan, so each run's repository admins are kept here, for
      # 90 days, and anyone who was an admin in that time is judged.
      - name: Restore the admin history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/admins
          key: admins-${{ github.run_id }}
          restore-keys: admins-
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::632839731153:role/substrate-collector
          aws-region: us-east-2
          role-session-name: substrate-live-${{ github.run_id }}
      - name: Collect, compile and gate the live system
        id: live
        env:
          OKTA_ORG_URL: ${{ secrets.OKTA_ORG_URL }}
          OKTA_CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}
          OKTA_KEY_ID: ${{ secrets.OKTA_KEY_ID }}
          OKTA_PRIVATE_KEY_PEM: ${{ secrets.OKTA_PRIVATE_KEY }}
          GITHUB_READ_TOKEN: ${{ secrets.SUBSTRATE_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          umask 077
          s="$RUNNER_TEMP/substrate"; t="$RUNNER_TEMP"
          printf '%s\n' "$OKTA_PRIVATE_KEY_PEM" > "$t/okta.pem"
          printf '%s' "$GITHUB_READ_TOKEN" > "$t/github.token"
          quiet() { "$@" > "$t/step.log" 2>&1 || { echo "failed: $1 $2"; exit 2; }; }
          quiet "$s" collect --out "$t/runtime" --okta-org-url "$OKTA_ORG_URL" --okta-client-id "$OKTA_CLIENT_ID" \
            --okta-key-id "$OKTA_KEY_ID" --okta-private-key "$t/okta.pem" --aws-audit-regions us-east-2,us-west-2 \
            --github-owner rookwright-test --github-repo substrate-self-test --github-token-path "$t/github.token"
          # The second declared Region (substrate ADR 0028): its own run,
          # whose per-Region services compile judges beside us-east-2's.
          quiet "$s" record-admins --runtime "$t/runtime" --history "$t/admins/history.json"
          echo "admins=true" >> "$GITHUB_OUTPUT"
          quiet env AWS_REGION=us-west-2 "$s" collect --out "$t/runtime-us-west-2" --okta-org-url "$OKTA_ORG_URL" --okta-client-id "$OKTA_CLIENT_ID" \
            --okta-key-id "$OKTA_KEY_ID" --okta-private-key "$t/okta.pem" --aws-audit-regions us-east-2,us-west-2
          quiet "$s" collect-documents --dir docs/policies --out "$t/documents.json" \
            --github-owner rookwright-test --github-repo substrate-self-test --github-token-path "$t/github.token"
          quiet "$s" collect-tls --boundary substrate-boundary.yaml --parameters substrate-parameters.yaml --out "$t/tls.json"
          quiet "$s" collect-security-txt --domain rookwright.com --out "$t/security_txt.json"
          quiet "$s" collect-components --source . --github-token-path "$t/github.token" --out "$t/components.json"
          rm -f "$t/okta.pem" "$t/github.token"
          # The binary is named, not "$s", so substrate can read from this
          # workflow that the gate judges the live system (cm-4.2).
          # okta-admin-checkpoint.json (substrate ADR 0035) is where the Okta
          # admin replay starts once the System Log no longer reaches the
          # org's creation (2027-01-02). Until then compile checks it
          # against the log. Each one lasts 89 days from its as_of.
          quiet "$RUNNER_TEMP/substrate" compile --source . --boundary substrate-boundary.yaml --parameters substrate-parameters.yaml \
            --okta-admin-checkpoint okta-admin-checkpoint.json \
            --runtime "$t/runtime" --region-runtime "$t/runtime-us-west-2" --documents "$t/documents.json" --documents-root . --tls "$t/tls.json" \
            --security-txt "$t/security_txt.json" --cmvp "$RUNNER_TEMP/cmvp/cmvp.json" --components "$t/components.json" --register substrate-controls.yaml --as-of "$(date -u +%Y-%m-%d)" --out "$t/out"
          echo "compiled=true" >> "$GITHUB_OUTPUT"
          printf '{"run_id":"%s","commit":"%s","substrate_commit":"%s","started_at":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SUBSTRATE_COMMIT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$t/out/run.json"
          "$RUNNER_TEMP/substrate" gate --baseline substrate-baseline-live.json --current "$t/out/ksi_results.json" --nodes "$t/out/ir/nodes.jsonl" | tee "$t/out/gate.txt"
      # Run history (history.tf): this run's compiled output, the gate's
      # verdict included, pass or fail, kept for a year so substrate's
      # UI can show the live system over time. Written as the history
      # writer role, which can only add objects there.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: always() && steps.live.outputs.compiled == 'true'
        with:
          role-to-assume: arn:aws:iam::632839731153:role/substrate-history-writer
          aws-region: us-east-2
          role-session-name: substrate-history-${{ github.run_id }}
      - name: Keep this run's compiled output
        if: always() && steps.live.outputs.compiled == 'true'
        run: |
          aws s3 cp --recursive --only-show-errors "$RUNNER_TEMP/out" \
            "s3://substrate-self-test-run-history-632839731153/runs/$(date -u +%Y-%m-%d)/$GITHUB_RUN_ID/"
      # The hosted demo at demo.rookwright.com (substrate ADR 0036) reads
      # its runs from a private R2 bucket. This copies the run there, with
      # the live baseline, using a token that can only write to that
      # bucket. A demo problem must never fail this job (cm-4.2 reads its
      # result), so the step can fail without failing the job; it still
      # shows red here, and the demo shows its data as stale.
      - name: Publish this run to the hosted demo
        if: always() && steps.live.outputs.compiled == 'true'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.DEMO_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DEMO_R2_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMO_R2_WRITE_SECRET_ACCESS_KEY }}
          # The history writer's session token isn't R2's.
          AWS_SESSION_TOKEN: ""
          AWS_REGION: auto
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::The hosted demo's R2 secrets aren't set, so this run isn't published to it."
            exit 1
          fi
          aws s3 cp --recursive --only-show-errors --endpoint-url "$R2_ENDPOINT" "$RUNNER_TEMP/out" \
            "s3://rookwright-demo-runs/runs/$(date -u +%Y-%m-%d)/$GITHUB_RUN_ID/"
          aws s3 cp --only-show-errors --endpoint-url "$R2_ENDPOINT" substrate-baseline-live.json \
            "s3://rookwright-demo-runs/baseline-live.json"
      # The next run restores the newest admin history saved. If a merge's
      # run started while this scheduled run was going, the two restored
      # the same history; whichever saved last would drop admins only the
      # other one saw (ac-6.2). So a scheduled run keeps its history only
      # when no merge's run started or was going meanwhile; otherwise the
      # merge's history stands, as it would without the schedule.
      - name: Check no merge's run overlapped this one
        id: overlap
        if: always() && steps.live.outputs.admins == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/substrate.yml/runs" -f event=push -f branch=main -f created=">=$started" -f per_page=1 -q .total_count)
          for status in in_progress queued; do
            n=$((n + $(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/substrate.yml/runs" -f event=push -f branch=main -f status="$status" -f per_page=1 -q .total_count)))
          done
          if [ "$n" -gt 0 ]; then
            echo "A merge's live run overlapped this one; its admin history is kept instead of this run's."
            echo "keep=false" >> "$GITHUB_OUTPUT"
          else
            echo "keep=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the admin history for the next run
        if: always() && steps.live.outputs.admins == 'true' && (github.event_name == 'push' || steps.overlap.outputs.keep == 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/admins
          key: admins-${{ github.run_id }}
