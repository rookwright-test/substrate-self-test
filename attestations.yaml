# Attestations (substrate ADR 0019): a named person's statement that a
# control no tool can check is in place - background screening, for
# example. Substrate only reads this file. An attestation is recorded and
# shown, never counted as verified (ADR 0020), and lasts 3 months from
# attested_on. Only controls substrate can't collect evidence for may be
# attested; compile rejects any other.
#
# Add entries from `substrate ui --evidence-repo` ("Record an
# attestation", ADR 0037), which opens a pull request as you. Every
# entry needs a reviewer's approval before it merges, like every change
# to this repository.
